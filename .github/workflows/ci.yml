name: MiniTask CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version:"3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run test
      - run: python -m pytest -q
      

